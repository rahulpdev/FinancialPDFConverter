[project]
name = "financialpdfconverter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Broad rule set — maximises what AI can detect and auto-correct
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import order)
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (common bugs and design issues)
    "SIM",  # flake8-simplify (simplifiable constructs)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

# Allow every fixable rule to be auto-corrected
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"

# Strict mode — enables all optional error-checking flags
strict = true

# Extra checks beyond strict
warn_unreachable = true          # flag dead code after return/raise

# AI-friendly error output: precise locations and machine-scannable codes
show_error_codes = true          # e.g. [return-value], [arg-type]
show_column_numbers = true       # exact character position
show_error_context = true        # print the offending line
pretty = true                    # aligned, readable output

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.2",
]
