[project]
name = "vsa-fastapi-project"
version = "0.1.0"
description = "FastAPI + PostgreSQL starter with vertical slice architecture, optimized for AI coding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.41.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
# Broad rule set — maximises what AI can detect and auto-correct
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import order)
    "UP",   # pyupgrade (modernise syntax)
    "B",    # flake8-bugbear (common bugs and design issues)
    "SIM",  # flake8-simplify (simplifiable constructs)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

# Allow every fixable rule to be auto-corrected
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"

# Strict mode — enables all optional error-checking flags
strict = true

# Extra checks beyond strict
warn_unreachable = true          # flag dead code after return/raise

# AI-friendly error output: precise locations and machine-scannable codes
show_error_codes = true          # e.g. [return-value], [arg-type]
show_column_numbers = true       # exact character position
show_error_context = true        # print the offending line
pretty = true                    # aligned, readable output

[tool.pytest.ini_options]
# Auto mode: async def test_* functions run as asyncio tests without decorators
asyncio_mode = "auto"
# Explicit fixture loop scope suppresses the deprecation warning
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "app"]
addopts = "--cov=main --cov=app --cov-report=term-missing --tb=short"

[tool.pyright]
pythonVersion = "3.12"

# Strict mode — enables every diagnostic rule Pyright exposes
typeCheckingMode = "strict"

# Extra safety checks
reportUninitializedInstanceVariable = "error"  # catch uninitialised attrs
reportImplicitStringConcatenation = "error"     # adjacent string literals
enableReachabilityAnalysis = true               # dead-code detection

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
